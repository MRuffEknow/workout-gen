  <circle cx="256" cy="256" r="148" fill="none" stroke="#a30c25" stroke-width="6"/>
  <circle cx="256" cy="256" r="74" fill="#a30c25"/>
  <circle cx="256" cy="256" r="50" fill="#c9cfcc"/>
  <circle cx="256" cy="256" r="26" fill="#e4e7e5"/>
</svg>
